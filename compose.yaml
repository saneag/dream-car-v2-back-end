name: dream-car
services:
  migrate:
    build: .
    command: [node, scripts/migrate.js]
    environment:
      DATABASE_URL: ${DATABASE_URL:?required}
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks: [home-apps]
    restart: 'no'
  api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?required}
      JWT_SECRET: ${JWT_SECRET:?required}
      PORT: 5000
      NODE_ENV: production
    depends_on:
      migrate:
        condition: service_completed_successfully
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "127.0.0.1:${BACKEND_PORT:-5005}:5000"
    networks:
      home-apps:
        aliases: [dream-car-api]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
  frontend:
    build: ../dream-car-v2-front-end
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5004}:80"
    networks: [home-apps]
volumes:
  uploads_data:
networks:
  home-apps:
    external: true
